<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 106 24" width="106" height="24" role="img" aria-label="License: MIT">
  <defs>
    <style>
      .mono { font-family: 'Cascadia Code', 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      @keyframes bPulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }
      .b-pulse { animation: bPulse 2.4s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .b-pulse { animation: none !important; } }
    </style>
    <clipPath id="clip_License">
      <rect x="0.5" y="0.5" width="105" height="23" rx="6" />
    </clipPath>
  </defs>
  <g clip-path="url(#clip_License)">
    <rect x="0" y="0" width="62" height="24" fill="#17191f" />
    <rect x="62" y="0" width="44" height="24" fill="#e9af5722" />
    <line x1="62" y1="0" x2="62" y2="24" stroke="#2a2e3b" stroke-width="1" />
  </g>
  <rect x="0.5" y="0.5" width="105" height="23" rx="6" fill="none" stroke="#2a2e3b" stroke-width="1" />
  
  <text x="31" y="15.5" text-anchor="middle" class="mono" font-size="10.5" fill="#c4c7d4">License</text>
  <text x="84" y="15.5" text-anchor="middle" class="mono" font-size="10.5" font-weight="600" fill="#e9af57">MIT</text>
</svg>
